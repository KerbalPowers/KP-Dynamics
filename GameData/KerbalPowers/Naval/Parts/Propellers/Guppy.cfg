		{
			key = 0 1 0 0
			key = 0.0874 1 0 0 
			key = 0.1020 0.5 0 0 // half thrust at ~35 m/s
			key = 0.1120 0 0 0 
		}
		// Water physics is limited | pressure-thrust unchanging
		atmCurve
		{
			key = 1 1 0 0
			key = 0 1 0 0
		}
