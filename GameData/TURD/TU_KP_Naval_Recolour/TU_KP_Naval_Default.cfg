@PART[kpdSmallVent,kpdLargeVent]:FOR[003_Standardised_Switching]:NEEDS[TexturesUnlimited&KerbalPowers]
{
    @MODULE[ModulePartVariants]
	{
		@VARIANT[White]
		{
			!TEXTURE,*{}
			EXTRA_INFO
			{
				textureSet = Default_Vents_White
			}
		}
		@VARIANT[Dark]
		{
			!TEXTURE,*{}
			EXTRA_INFO
			{
				textureSet = Default_Vents_Grey
			}
		}
	}
	%MODULE[TUPartVariant]
	{
		%name = TUPartVariant
	}
	%MODULE[SSTURecolorGUI]
	{
		%name = SSTURecolorGUI
	}
}
+KSP_TEXTURE_SET[Stock_Default]:NEEDS[TexturesUnlimited&KerbalPowers]
{
	@name = Default_Vents_White
	@MATERIAL
	{
		@shader = KSP/Bumped Specular
		
		mesh = BodyLarge
		mesh = SlatsLarge
		mesh = BodySmall
		mesh = SlatsSmall

		PROPERTY
		{
        	name = _Color
        	color = #ffffff
		}

		texture = _MainTex,KerbalPowers/Naval/Parts/Vents/IntakeVentWhite_Tex
		texture = _BumpMap,KerbalPowers/Naval/Parts/Vents/IntakeVent_NRM
		texture = _Emissive,TURD/TU_Standardised_Switching/000_PlaceholderTextures/Emis
	}
}
+KSP_TEXTURE_SET[Stock_Default]:NEEDS[TexturesUnlimited&KerbalPowers]
{
	@name = Default_Vents_Grey
	@MATERIAL
	{
		@shader = KSP/Bumped Specular
		
		mesh = BodyLarge
		mesh = SlatsLarge
		mesh = BodySmall
		mesh = SlatsSmall
		
		PROPERTY
		{
        	name = _Color
        	color = #cecece
		}

		texture = _MainTex,KerbalPowers/Naval/Parts/Vents/IntakeVentGrey_Tex
		texture = _BumpMap,KerbalPowers/Naval/Parts/Vents/IntakeVent_NRM
		texture = _Emissive,TURD/TU_Standardised_Switching/000_PlaceholderTextures/Emis
	}
}