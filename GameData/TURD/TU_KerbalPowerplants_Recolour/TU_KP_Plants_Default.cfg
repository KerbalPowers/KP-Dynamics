
// Powerplants/Parts/Leopard

@PART[KPLeopard]:FOR[000_TU_KerbalPowerplants_000]:NEEDS[TexturesUnlimited&KerbalPowers]
{
	MODULE
	{
		name = KSPTextureSwitch
		sectionName = Appearance
		currentTextureSet = Stock_Default_KP_Leopard
		textureSet = Stock_Default_KP_Leopard
	}
}
+KSP_TEXTURE_SET[Stock_Default]:NEEDS[TexturesUnlimited&AirplanePlus]
{
	@name = Stock_Default_KP_Leopard
	@MATERIAL
	{
		//@shader = KSP/Diffuse
		
		mesh = Body
		
		texture = _MainTex,KerbalPowers/Plants/Parts/Leopard/Leopard_Tex
		texture = _BumpMap,TURD/TU_Standardised_Switching/000_PlaceholderTextures/Bump
		texture = _Emissive,KerbalPowers/Plants/Parts/Leopard/Leopard_Emis
	}
}

